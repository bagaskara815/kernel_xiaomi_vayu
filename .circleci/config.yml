version: 2.1

jobs:
  build:
    docker:
      - image: orgesified/latest:latest
    environment:
      CCACHE_DIR: /home/circleci/project/.ccache
    steps:
      - checkout

      - run:
          name: Install packages
          command: |
            set -euo pipefail
            if [ -f /etc/apt/sources.list ]; then
              sed -i 's/lunar/jammy/g' /etc/apt/sources.list || true
            fi
            apt-get update -yqq
            apt-get install --no-install-recommends -yqq \
              make bc bison flex cpio ca-certificates curl wget zstd \
              python3 zip libarchive-tools git findutils \
              ccache xz-utils libssl-dev \
              || apt-get install --no-install-recommends -yqq \
              make bc bison flex cpio ca-certificates curl wget zstd \
              python3 zip git findutils ccache xz-utils libssl-dev

      - restore_cache:
          name: Restore Neutron clang cache
          keys:
            - tc-neutron-v2-{{ arch }}

      - restore_cache:
          name: Restore Neutron glibc cache
          keys:
            - tc-neutron-glibc-v2-{{ arch }}

      - restore_cache:
          name: Restore ccache
          keys:
            - ccache-v2-{{ .Branch }}-{{ .Revision }}
            - ccache-v2-{{ .Branch }}-
            - ccache-v2-

      - run:
          name: Prepare ccache
          command: |
            set -euo pipefail
            mkdir -p "${CCACHE_DIR:-$HOME/project/.ccache}"
            export CCACHE_DIR="${CCACHE_DIR:-$HOME/project/.ccache}"
            ccache -M 4G
            ccache -o compression=true
            ccache -z
            ccache -s || true
            if [ -d /usr/lib/ccache ]; then
              echo 'export PATH="/usr/lib/ccache:$PATH"' >> "$BASH_ENV"
            fi
            echo "export CCACHE_DIR=${CCACHE_DIR}" >> "$BASH_ENV"

      - run:
          name: Verify toolchain cache
          command: |
            set +e
            echo "neutron clang: $(.tools/neutron-clang/bin/clang --version >/dev/null 2>&1 && echo OK || echo NOT-RUNNABLE)"
            echo "neutron glibc: $(test -d ~/.neutron-tc/glibc && echo PRESENT || echo MISSING)"
            echo "anykernel: $(test -d .tools/AnyKernel && echo HIT || echo MISS)"
            du -sh .tools .ccache 2>/dev/null || true
            df -h . || true

      - run:
          name: Build kernel (Neutron Clang)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            chmod +x build.sh
            bash build.sh
            ccache -s || true

      - save_cache:
          name: Save Neutron clang cache
          key: tc-neutron-v2-{{ arch }}
          paths:
            - .tools/neutron-clang

      - save_cache:
          name: Save Neutron glibc cache
          key: tc-neutron-glibc-v2-{{ arch }}
          paths:
            - ~/.neutron-tc

      - save_cache:
          name: Save ccache
          key: ccache-v2-{{ .Branch }}-{{ .Revision }}
          paths:
            - .ccache

      - store_artifacts:
          path: dist
          destination: kernel-dist

workflows:
  build-workflow:
    jobs:
      - build
